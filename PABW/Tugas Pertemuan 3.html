<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kota Majalengka</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        /* Header & Banner */
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .banner {
            width: 100%;
            height: 250px;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        /* Menu Navigasi */
        nav {
            background-color: #111;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
            font-size: 14px;
            transition: 0.3s;
        }
        nav a:hover {
            background-color: #e67e22;
        }
        /* Container Utama */
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }
        .main-content {
            flex: 2;
            min-width: 300px;
        }
        .sidebar {
            flex: 1;
            min-width: 300px;
        }
        /* Paket Wisata */
        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }
        .paket-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            flex: 1;
            min-width: 250px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .card-body {
            padding: 15px;
        }
        .card-body p {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
        }
        /* Video Section */
        .video-box {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .video-box iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 5px;
        }
        /* Footer */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Header / Banner Desa Wisata -->
    <header>
        <h2>Selamat Datang Di Majalengka</h2>
    </header>
    <div class="banner">
        WISATA Rental PS Gamehunt
    </div>

    <!-- Menu Aplikasi -->
    <nav>
        <a href="#">Beranda</a>
        <a href="#">About</a>
        <a href="#">Fasilitas Wisata</a>
        <a href="#">Paket Wisata</a>
        <a href="#">Dokumentasi</a>
        <a href="#">Pemesanan</a>
        <a href="#">Gallery</a>
    </nav>

    <!-- Konten Utama -->
    <div class="container">
        <!-- Daftar Paket Wisata -->
        <div class="main-content">
            <h3 class="section-title">Daftar Paket Wisata</h3>
            <div class="paket-grid">
                <!-- Paket 1 -->
                <div class="card">
                    <img src="foto/r.jpg">
                    <div class="card-body">
                        <strong>Paket Solo PS4</strong>
                        <p>08 Oktober 2026</p>
                    </div>
                </div>
                <!-- Paket 2 -->
                <div class="card">
                    <img src="foto/m.jpg" alt="ATV dan Rafting">
                    <div class="card-body">
                        <strong>Paket Makanan Untuk Makan</strong>
                        <p>08 Oktober 2026</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Link Video Youtube -->
        <div class="sidebar">
            <h3 class="section-title">Video Aktivitas Wisata</h3>
            <div class="video-box">
                <iframe src="https://youtu.be/Bw1p4LMlDPw?si=-1BdQliS8DBPND16" title="Gamehunt"></iframe>
                <p style="font-size: 12px; margin-top: 10px; color: #666;">Pesona Indonesia - Aktivitas Paket Wisata</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>

</body>
</html>
